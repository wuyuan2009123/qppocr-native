[package]
name = "qppocr-capi"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "C ABI (cdylib) bindings for the qppocr OCR engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
qppocr = { version = "0.3.1", features = ["serde", "gpu"] }
serde_json = "1"

[profile.release]
strip = true
